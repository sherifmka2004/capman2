[project]
name = "capman2"
version = "0.1.0"
description = "Personal cognitive workflow capture engine — clone expert knowledge and thinking patterns"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pynput>=1.7.7",
    "mss>=9.0.2",
    "watchdog>=4.0.0",
    "pytesseract>=0.3.13",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyperclip>=1.9.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "pystray>=0.19",
    "pillow>=10.0",
    "tomli-w>=1.0",
]

[project.scripts]
capman = "capman.main:cli"
capman-desktop = "capman.desktop:run_desktop"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capman"]

[tool.uv]
override-dependencies = [
    # onnxruntime 1.21+ dropped macOS x86_64 (Intel) wheels; cap to last supported version
    "onnxruntime>=1.19.2,<1.21 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
