[core]
data_dir = "~/.capman"
log_level = "INFO"

[sensors]
enabled = ["window", "screenshot", "keyboard", "mouse", "clipboard", "shell", "filesystem", "browser_relay", "documents", "idle"]

[sensors.screenshot]
interval_seconds = 30
on_event_types = ["url_visit", "shell_command"]
save_dir = "~/.capman/screenshots"
max_disk_gb = 5.0
# Storage reduction options
format = "png"          # "png" | "jpeg" | "webp"
quality = 80            # 1-100, applies to jpeg/webp only
scale = 1.0             # 0.1-1.0, downscale before saving
retain_days = 0         # delete screenshots older than N days (0 = disabled)
delete_after_ocr = false  # delete file after pipeline OCR extracts text

[sensors.keyboard]
aggregate_window_ms = 500
exclude_apps = ["1Password", "Keychain", "Signal", "Bitwarden"]
min_text_length = 3

[sensors.mouse]
track_clicks               = true
# When true, every click is enriched with a {role,label} read off the OS
# accessibility tree (PyObjC AX on macOS, AT-SPI on Linux, UIAutomation on
# Windows). A 50ms hard ceiling guards against slow AX calls.
resolve_element_at_click   = true
element_lookup_timeout_ms  = 50
# Coalesced scroll bursts → one MOUSE_SCROLL per burst.
track_scroll               = true
scroll_debounce_ms         = 800     # close a burst after this much quiet
scroll_min_burst_ticks     = 3       # require ≥ N ticks before emitting
# Per-app per-minute mouse-move heatmap (no per-event move storage).
track_move_heatmap         = true
heatmap_grid               = 100     # 100 × 100 cells per screen
heatmap_flush_interval_s   = 60

[sensors.idle]
enabled                    = true
idle_threshold_s           = 180     # no key/click/scroll for N s → AFK
poll_interval_s            = 5

[sensors.clipboard]
poll_interval_ms = 500

[sensors.shell]
watch_files = ["~/.bash_history", "~/.zsh_history"]
capture_output = false
output_max_bytes = 4096

[sensors.filesystem]
watch_paths = ["~/Desktop", "~/Downloads", "~/Documents", "~/code", "~/projects"]
# `extensions` gates *content diff* capture (CODE_DIFF events) — metadata events
# (open/save/delete/rename) are emitted for any file, subject to the filters below.
extensions = [".py", ".js", ".ts", ".tsx", ".jsx", ".go", ".rs", ".md", ".json", ".yaml", ".yml", ".toml", ".sh", ".sql", ".html", ".css", ".c", ".h", ".cpp", ".java", ".rb", ".php", ".txt", ".ini", ".cfg", ".env", ".tf", ".proto", ".vue", ".svelte"]
# Paths/names never recorded ("**/X/**" = exclude any dir segment matching X)
exclude = [
  "**/.git/**", "**/node_modules/**", "**/.venv/**", "**/venv/**", "**/__pycache__/**",
  "**/.*cache/**", "**/.next/**", "**/dist/**", "**/build/**", "**/target/**", "**/.cache/**",
  "**/.idea/**", "**/.vscode/**", "**/.tox/**", "**/coverage/**", "**/.nyc_output/**",
  "*.pyc", "*.pyo", "*.lock", "*.swp", "*.swpx", "*.swx", "*~", ".#*", "4913",
  "*.tmp", "*.temp", "*.crdownload", "*.part", "*.partial",
]
# Coalesce a burst of writes to the same file into one FILE_SAVE.
debounce_ms = 1200
capture_diffs = true
diff_max_bytes = 1048576
snapshot_dir = "~/.capman/file_snapshots"

# --- direct-user-action attribution ---
# When true, only record file ops attributable to the user (editor / interactive
# shell command / focused file manager) — drop background churn from build tools,
# language servers, watchers, package managers, daemons, and capman itself.
user_only = true
# If true, keep file ops with no attribution signal (treat as "likely_user").
keep_unknown = false
# Grace window (s) between a user action and the filesystem event landing.
foreground_window_grace_s = 4
# A watchdog event "counts" if a matching interactive shell command ran this recently.
shell_correlate_s = 8
interactive_apps = [
  "code", "code - insiders", "cursor", "vscodium", "vim", "nvim", "neovim", "emacs",
  "nano", "micro", "helix", "sublime_text", "sublime text", "gedit", "kate", "kwrite",
  "geany", "idea", "intellij idea", "pycharm", "goland", "webstorm", "rubymine", "clion",
  "xcode", "textedit", "obsidian", "typora", "notepad++",
  "finder", "nautilus", "files", "dolphin", "thunar", "nemo", "pcmanfm", "caja",
  "kitty", "alacritty", "wezterm", "ghostty", "terminal", "iterm2", "iterm",
  "gnome-terminal", "konsole", "xterm", "urxvt", "terminator", "tilix", "windows terminal",
  "hyper", "warp",
]
interactive_cli = [
  "vim", "nvim", "vi", "view", "emacs", "emacsclient", "nano", "micro", "helix", "hx",
  "ed", "ex", "cat", "bat", "less", "more", "head", "tail", "sed", "awk", "perl",
  "cp", "mv", "rm", "rmdir", "touch", "mkdir", "ln", "tee", "truncate", "dd",
  "tar", "unzip", "zip", "gzip", "gunzip", "bzip2", "xz", "7z", "rsync",
  "code", "subl", "open", "xdg-open", "gio", "shred", "install", "patch",
]
machine_procs = [
  "node", "deno", "bun", "webpack", "esbuild", "swc", "tsc", "tsserver", "vite", "next",
  "next-server", "rollup", "parcel", "turbo", "nx", "ng", "cargo", "rustc", "rust-analyzer",
  "gofmt", "gopls", "pip", "pip3", "uv", "poetry", "pdm", "pipenv", "conda", "mamba", "hatch",
  "npm", "yarn", "pnpm", "npx", "corepack", "pyright", "pylsp", "ruff", "black", "mypy",
  "flake8", "typescript-language-server", "eslint", "gradle", "mvn", "maven", "make", "cmake",
  "ninja", "meson", "bazel", "ccache", "git", "hg", "svn", "rclone", "borg", "restic",
  "systemd", "systemd-journald", "cron", "crond", "updatedb", "mlocate", "plocate",
  "tracker-miner-fs", "tracker-extract", "baloo_file", "mds", "mds_stores", "mdworker",
  "mdworker_shared", "fseventsd", "dropbox", "onedrive", "syncthing", "nextcloud",
  "capman", "uvicorn", "gunicorn", "chromedriver",
]

# --- deep monitor (privileged helper: tools/capman-fsmon) — captures file *opens/reads*
#     + the responsible process. Needs root (and Full Disk Access on macOS).
#       Linux:  fanotify | audit | ebpf      macOS: eslogger | fs_usage
#       "off" disables it; any unrecognized value (incl. "fanotify" on macOS) is
#       treated as "auto" by `capman-fsmon --backend auto`. See docs/FILE_MONITORING.md.
deep_monitor = "fanotify"
deep_monitor_paths = []   # defaults to watch_paths when empty

[sensors.browser_relay]
port = 7331

[sensors.documents]
poll_interval_s = 2.0
# Minimum dwell seconds before a slide/page change is considered meaningful
min_dwell_s = 3.0

# --- document content capture (slide/page/sheet text the user actually reads) ---
# When true, the document sensor wraps each navigation in an attention-gated
# tracker. Quick scroll-throughs never reach the dwell threshold and produce no
# event; units the user dwells on get their visible text extracted (via the
# platform adapter's app-model hook, OCR fallback) and emitted as DOC_CONTENT.
# Full text is embedded in ChromaDB; SQLite keeps a 300-char excerpt + size.
capture_content              = true
content_min_attention_s      = 4.0     # how long the user must dwell before we capture
content_revisit_threshold    = 2       # OR: how many revisits to a unit also trigger capture
content_max_items_per_doc    = 80      # safety cap so a 500-page PDF doesn't flood
content_max_chars            = 8000    # truncate very long extractions
content_use_app_model        = true    # try the per-app accessibility/automation hook first
content_use_ocr_fallback     = true    # fall back to screenshot+OCR if app model yields nothing
content_extractor_order      = ["app_model", "ocr"]

[pipeline.session]
idle_threshold_s = 90
cool_period_s = 120
hard_break_s = 600
min_session_events = 5
min_session_duration_s = 60

[pipeline.analysis]
enabled = true
pass1_model = "claude-haiku-4-5-20251001"
pass2_model = "claude-sonnet-4-6"
pass3_model = "claude-haiku-4-5-20251001"
batch_delay_s = 60
cot_reusability_threshold = 0.5

[storage]
sqlite_path = "~/.capman/timeline.db"
chroma_path = "~/.capman/chroma"
knowledge_dir = "~/.capman/knowledge"
obsidian_vault = ""

[api]
host = "0.0.0.0"
port = 7331
