name: Build Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            artifact_name: capman2-macos-arm64.dmg
            platform: macos
          - os: macos-13
            arch: x86_64
            artifact_name: capman2-macos-x86_64.dmg
            platform: macos
          - os: ubuntu-22.04
            arch: x86_64
            artifact_name: capman2-linux-x86_64.AppImage
            platform: linux
          - os: windows-latest
            arch: x86_64
            artifact_name: capman2-windows-x86_64-setup.exe
            platform: windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }} ${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install project dependencies
        run: uv sync --no-dev

      - name: Install PyInstaller and desktop deps
        run: uv pip install pyinstaller pillow pystray tomli-w

      # macOS: install create-dmg for DMG packaging
      - name: Install create-dmg (macOS)
        if: matrix.platform == 'macos'
        run: brew install create-dmg

      # Linux: install GTK + AppImage tools
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libgirepository1.0-dev \
            gir1.2-ayatanaappindicator3-0.1 \
            fuse \
            libfuse2 \
            wget
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      # Windows: Inno Setup is pre-installed on windows-latest runners
      # If not, uncomment: - run: choco install innosetup -y

      - name: Build with PyInstaller
        run: uv run pyinstaller capman.spec --distpath dist --workpath build --noconfirm

      # ── macOS packaging ──────────────────────────────────────────────
      - name: Ad-hoc code sign (macOS)
        if: matrix.platform == 'macos'
        run: |
          # Ad-hoc sign the app bundle so macOS doesn't block it at launch
          codesign --force --deep --sign - dist/capman2.app

      - name: Create DMG (macOS)
        if: matrix.platform == 'macos'
        run: |
          create-dmg \
            --volname "capman2" \
            --window-pos 200 120 \
            --window-size 560 280 \
            --icon-size 100 \
            --icon "capman2.app" 140 120 \
            --hide-extension "capman2.app" \
            --app-drop-link 400 120 \
            "dist/${{ matrix.artifact_name }}" \
            "dist/capman2.app"

      # ── Linux packaging ──────────────────────────────────────────────
      - name: Create AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/64x64/apps
          cp -r dist/capman2/* AppDir/usr/bin/
          cp packaging/linux/capman2.desktop AppDir/
          cp packaging/linux/capman2.desktop AppDir/usr/share/applications/
          # Generate a placeholder icon if the asset doesn't exist yet
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (64, 64), (0,0,0,0))
          d = ImageDraw.Draw(img)
          d.ellipse([2,2,62,62], fill=(37,99,235,255))
          img.save('AppDir/capman2.png', 'PNG')
          img.save('AppDir/usr/share/icons/hicolor/64x64/apps/capman2.png', 'PNG')
          "
          ARCH=x86_64 appimagetool AppDir dist/${{ matrix.artifact_name }}

      # ── Windows packaging ────────────────────────────────────────────
      - name: Create installer (Windows)
        if: matrix.platform == 'windows'
        run: |
          iscc packaging\windows\capman2.iss
          move dist\capman2-windows-x86_64-setup.exe dist\${{ matrix.artifact_name }}
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  # Create GitHub Release when a tag is pushed
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
